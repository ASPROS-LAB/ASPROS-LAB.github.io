title: "Gallery"
layout: default
permalink: /gallery.html
---

<div class="container my-5">
  <h1 class="mb-4 font-weight-bold text-center">Gallery</h1>

  <!-- ✅ 그리드 영역 -->
  <div class="gallery-grid" id="gallery-container"></div>

  <!-- ✅ 페이지네이션 -->
  <nav class="d-flex justify-content-center mt-4">
    <ul class="pagination" id="pagination"></ul>
  </nav>
</div>

<!-- ✅ 모달 -->
<div class="modal fade" id="mediaModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content bg-transparent border-0 text-center">
      <div id="modalContent"></div>
    </div>
  </div>
</div>

<!-- ✅ 스타일 -->
<style>
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
  }

  .gallery-grid img,
  .gallery-grid video,
  .gallery-grid iframe {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.2s ease;
  }

  .gallery-grid img:hover,
  .gallery-grid video:hover,
  .gallery-grid iframe:hover {
    transform: scale(1.03);
  }

  .modal-content {
    background-color: rgba(0, 0, 0, 0.85);
    padding: 10px;
  }

  .modal-content iframe,
  .modal-content video,
  .modal-content img {
    max-width: 100%;
    max-height: 80vh;
    border-radius: 10px;
  }

  @media (max-width: 768px) {
    .gallery-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 576px) {
    .gallery-grid {
      grid-template-columns: 1fr;
    }
  }

  .pagination .page-link {
    color: #007bff;
    cursor: pointer;
  }

  .pagination .page-item.active .page-link {
    background-color: #007bff;
    color: white;
    border-color: #007bff;
  }
</style>

<!-- ✅ 스크립트 -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const galleryItems = [
      { type: "image", src: "/assets/images/1.jpg" },
      { type: "image", src: "/assets/images/2.jpg" },
      { type: "video", src: "/assets/images/animation_kineis.mp4" },
      { type: "image", src: "/assets/images/3.jpg" },
      { type: "youtube", src: "https://www.youtube.com/embed/dQw4w9WgXcQ" },
      { type: "image", src: "/assets/images/4.jpg" },
      { type: "image", src: "/assets/images/5.jpg" },
      { type: "image", src: "/assets/images/6.jpg" },
      // ✅ 필요 시 계속 추가 가능
    ];

    const itemsPerPage = 25;
    let currentPage = 1;

    const container = document.getElementById("gallery-container");
    const pagination = document.getElementById("pagination");
    const modalContent = document.getElementById("modalContent");

    function renderGallery(page) {
      container.innerHTML = "";
      const start = (page - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      const items = galleryItems.slice(start, end);

      items.forEach(item => {
        let el;

        if (item.type === "image") {
          el = document.createElement("img");
          el.src = item.src;
        } else if (item.type === "video") {
          el = document.createElement("video");
          el.src = item.src;
          el.controls = false;
          el.muted = true;
          el.loop = true;
          el.autoplay = true;
        } else if (item.type === "youtube") {
          el = document.createElement("iframe");
          el.src = item.src;
          el.allow = "accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture";
          el.frameBorder = "0";
          el.allowFullscreen = true;
          el.style.height = "200px";
        }

        el.className = "img-fluid";
        el.addEventListener("click", () => {
          modalContent.innerHTML = "";
          let modalEl;

          if (item.type === "image") {
            modalEl = document.createElement("img");
            modalEl.src = item.src;
          } else if (item.type === "video") {
            modalEl = document.createElement("video");
            modalEl.src = item.src;
            modalEl.controls = true;
            modalEl.autoplay = true;
          } else if (item.type === "youtube") {
            modalEl = document.createElement("iframe");
            modalEl.src = item.src + "?autoplay=1";
            modalEl.allow = "autoplay; encrypted-media";
            modalEl.frameBorder = "0";
            modalEl.allowFullscreen = true;
            modalEl.style.width = "100%";
            modalEl.style.aspectRatio = "16 / 9";
          }

          modalEl.className = "img-fluid";
          modalContent.appendChild(modalEl);
          new bootstrap.Modal(document.getElementById("mediaModal")).show();
        });

        container.appendChild(el);
      });

      renderPagination();
    }

    function renderPagination() {
      pagination.innerHTML = "";
      const totalPages = Math.ceil(galleryItems.length / itemsPerPage);

      const prev = document.createElement("li");
      prev.className = "page-item" + (currentPage === 1 ? " disabled" : "");
      prev.innerHTML = `<span class="page-link">&laquo;</span>`;
      prev.onclick = () => {
        if (currentPage > 1) {
          currentPage--;
          renderGallery(currentPage);
        }
      };
      pagination.appendChild(prev);

      for (let i = 1; i <= totalPages; i++) {
        const li = document.createElement("li");
        li.className = "page-item" + (i === currentPage ? " active" : "");
        li.innerHTML = `<span class="page-link">${i}</span>`;
        li.onclick = () => {
          currentPage = i;
          renderGallery(currentPage);
        };
        pagination.appendChild(li);
      }

      const next = document.createElement("li");
      next.className = "page-item" + (currentPage === totalPages ? " disabled" : "");
      next.innerHTML = `<span class="page-link">&raquo;</span>`;
      next.onclick = () => {
        if (currentPage < totalPages) {
          currentPage++;
          renderGallery(currentPage);
        }
      };
      pagination.appendChild(next);
    }

    renderGallery(currentPage);
  });
</script>
